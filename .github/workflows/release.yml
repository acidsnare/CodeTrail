name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            artifact: app/build/compose/binaries/main/dmg/*.dmg
            launcher: app/build/compose/binaries/main/app/CodeTrail.app/Contents/MacOS/CodeTrail
          - os: windows-latest
            task: packageMsi
            artifact: app/build/compose/binaries/main/msi/*.msi
            launcher: app/build/compose/binaries/main/app/CodeTrail/CodeTrail.exe
          - os: ubuntu-latest
            task: packageDeb
            artifact: app/build/compose/binaries/main/deb/*.deb
            launcher: app/build/compose/binaries/main/app/CodeTrail/bin/CodeTrail
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # jpackage on Windows needs WiX 3.x on PATH; the runner image ships it under this path.
      - name: Add WiX to PATH
        if: runner.os == 'Windows'
        run: echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        shell: pwsh

      - name: Build installer
        run: ./gradlew :app:createDistributable :app:${{ matrix.task }} --no-daemon --console=plain

      # Smoke test: the packaged launcher must start its bundled JVM and stay alive for a few
      # seconds. Catches broken JVM options or missing modules that only show up at run time.
      - name: Smoke test launcher (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          APP=app/build/compose/binaries/main/app
          echo "--- app image"; find "$APP" -maxdepth 3 | head -40
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq xvfb >/dev/null
            Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
            sleep 2
            export DISPLAY=:99 SKIKO_RENDER_API=SOFTWARE
          fi
          LAUNCHER=$(find "$APP" -type f -iname codetrail -perm -u+x | head -1)
          if [ -z "$LAUNCHER" ]; then echo "launcher not found"; exit 1; fi
          echo "launcher: $LAUNCHER"
          "$LAUNCHER" > launcher.log 2>&1 &
          PID=$!
          sleep 25
          echo "--- launcher.log"; cat launcher.log || true
          if ! kill -0 $PID 2>/dev/null; then echo "launcher exited early"; exit 1; fi
          if grep -qiE "Could not create the Java Virtual Machine|Unrecognized option|Exception in thread" launcher.log; then exit 1; fi
          kill $PID || true
          echo "launcher alive after 25s"

      - name: Smoke test launcher (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = "app/build/compose/binaries/main/app"
          Write-Host "--- app image"; Get-ChildItem -Recurse -Depth 2 $app | Select-Object -First 40 | ForEach-Object { $_.FullName }
          $exe = Get-ChildItem -Recurse -Filter CodeTrail.exe $app | Select-Object -First 1
          if (-not $exe) { Write-Host "launcher not found"; exit 1 }
          Write-Host "launcher: $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardOutput out.log -RedirectStandardError err.log
          Start-Sleep -Seconds 25
          Write-Host "--- logs"; Get-Content out.log, err.log -ErrorAction SilentlyContinue
          if ($p.HasExited) { Write-Host "launcher exited early with $($p.ExitCode)"; exit 1 }
          $log = (Get-Content out.log, err.log -ErrorAction SilentlyContinue) -join "`n"
          if ($log -match "Could not create the Java Virtual Machine|Unrecognized option|Exception in thread") { exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "launcher alive after 25s"

      - uses: actions/upload-artifact@v4
        with:
          name: codetrail-${{ runner.os }}
          path: ${{ matrix.artifact }}

  # Browser build: Kotlin/Wasm + Compose, a folder of static files served from GitHub Pages.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build web distribution
        run: ./gradlew :app:wasmJsBrowserDistribution --no-daemon --console=plain
      - name: Zip for the release
        run: cd app/build/dist/wasmJs/productionExecutable && zip -qr ../../../../../codetrail-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: codetrail-web
          path: codetrail-web.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/dist/wasmJs/productionExecutable

  # Android: APK for sideloading plus an App Bundle for Google Play.
  # With the ANDROID_KEYSTORE_* secrets set both are signed with the release key; without them
  # the debug key is used, which is fine for GitHub Releases but not for Play.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21
      # The action's default package list includes the retired "tools" package, which fails;
      # the runner already ships the SDK, we only need licenses accepted and platform-tools.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK and App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :android:assembleRelease :android:bundleRelease --no-daemon --console=plain
      - name: Rename
        run: |
          cp android/build/outputs/apk/release/android-release.apk codetrail-android.apk
          cp android/build/outputs/bundle/release/android-release.aab codetrail-android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: codetrail-android
          path: |
            codetrail-android.apk
            codetrail-android.aab

  # Publishes the web build to https://<owner>.github.io/<repo>/ on every tag.
  # One-time setup: Settings -> Pages -> Source: "GitHub Actions".
  pages:
    needs: web
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: [package, web, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: codetrail-*
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
