org.gradle.jvmargs=-Xmx4g
# Kotlin/Native release linking of the iOS framework needs more than the default heap.
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official

# Single source for the release version: desktop packages, Android versionName/versionCode
# (major*100 + minor*10 + patch) and the cache-busting query on the web page all derive from it.
codetrail.version=1.7.2
